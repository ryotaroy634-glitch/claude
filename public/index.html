<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech News RSS Reader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: #888;
      font-size: 1.1rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      padding: 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #222;
      border: 1px solid #444;
      border-radius: 25px;
      padding: 5px 15px;
      transition: border-color 0.3s ease;
    }

    .search-box:focus-within {
      border-color: #667eea;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 0.9rem;
      padding: 5px;
      width: 180px;
      outline: none;
    }

    .search-box input::placeholder {
      color: #666;
    }

    .search-icon {
      color: #666;
      margin-right: 5px;
    }

    .filter-btn {
      padding: 10px 20px;
      border: 1px solid #444;
      border-radius: 25px;
      background: transparent;
      color: #ccc;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .filter-btn.active {
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-color: transparent;
      color: white;
    }

    .action-btn {
      padding: 10px 25px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .action-btn:hover {
      transform: scale(1.05);
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .refresh-btn {
      background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
      color: white;
    }

    .read-all-btn {
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .collect-btn {
      background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
      background: #151515;
      border-bottom: 1px solid #333;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #667eea;
    }

    .stat-value.unread {
      color: #38ef7d;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: #888;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #333;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      padding: 20px 0;
    }

    .feed-card {
      background: #1a1a1a;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .feed-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border-color: #444;
    }

    .feed-card-header {
      padding: 15px;
      background: #222;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feed-icon {
      font-size: 1.5rem;
    }

    .feed-title {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      flex: 1;
    }

    .feed-category {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: #333;
      color: #aaa;
    }

    .feed-items {
      padding: 10px 0;
    }

    .feed-item {
      padding: 12px 15px;
      border-bottom: 1px solid #252525;
      transition: background 0.2s ease;
      cursor: pointer;
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .feed-item:hover {
      background: #252525;
    }

    .feed-item.read {
      opacity: 0.6;
    }

    .feed-item.read a {
      color: #888;
    }

    .feed-item a {
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.9rem;
      line-height: 1.4;
      display: block;
    }

    .feed-item a:hover {
      color: #667eea;
    }

    .feed-item-meta {
      display: flex;
      gap: 15px;
      margin-top: 6px;
      font-size: 0.75rem;
      color: #666;
    }

    .unread-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #38ef7d;
      border-radius: 50%;
      margin-right: 8px;
    }

    .timeline-view {
      max-width: 800px;
      margin: 0 auto;
    }

    .timeline-item {
      padding: 20px;
      border-left: 2px solid #333;
      margin-left: 20px;
      position: relative;
      transition: border-color 0.2s ease;
      cursor: pointer;
    }

    .timeline-item:hover {
      border-color: #667eea;
    }

    .timeline-item.read {
      opacity: 0.6;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -7px;
      top: 25px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #333;
      border: 2px solid #1a1a1a;
    }

    .timeline-item:hover::before {
      background: #667eea;
    }

    .timeline-item.unread::before {
      background: #38ef7d;
    }

    .timeline-source {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .timeline-source-name {
      font-size: 0.85rem;
      color: #888;
    }

    .timeline-title {
      font-size: 1.1rem;
      color: #e0e0e0;
      text-decoration: none;
      line-height: 1.4;
    }

    .timeline-title:hover {
      color: #667eea;
    }

    .timeline-meta {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #666;
    }

    .timeline-content {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #999;
      line-height: 1.5;
    }

    .errors-section {
      margin-top: 40px;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 12px;
      border: 1px solid #442222;
    }

    .errors-title {
      color: #ff6b6b;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    .error-item {
      padding: 10px;
      margin-bottom: 8px;
      background: #221a1a;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .error-name {
      color: #ff9999;
      font-weight: 600;
    }

    .error-message {
      color: #888;
      margin-top: 4px;
    }

    .view-toggle {
      display: flex;
      gap: 5px;
      background: #222;
      padding: 5px;
      border-radius: 25px;
    }

    .view-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: #333;
      color: #fff;
    }

    .notification-bar {
      background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
      color: white;
      padding: 10px 20px;
      text-align: center;
      font-size: 0.9rem;
      display: none;
    }

    .notification-bar.show {
      display: block;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 0.85rem;
      border-top: 1px solid #222;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8rem;
      }

      .feed-grid {
        grid-template-columns: 1fr;
      }

      .controls {
        padding: 15px;
        gap: 10px;
      }

      .filter-btn {
        padding: 8px 15px;
        font-size: 0.85rem;
      }

      .search-box input {
        width: 120px;
      }

      .stats {
        gap: 20px;
      }

      .action-btn {
        padding: 8px 15px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div id="notification-bar" class="notification-bar"></div>

  <header>
    <h1>Tech News RSS Reader</h1>
    <p>US Major Tech Companies & Technology Media Updates</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <span class="search-icon">&#x1F50D;</span>
      <input type="text" id="search-input" placeholder="Search articles..." onkeyup="handleSearch(event)">
    </div>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="Tech Companies">Tech Companies</button>
    <button class="filter-btn" data-filter="Tech Media">Tech Media</button>
    <div class="view-toggle">
      <button class="view-btn active" data-view="grid">Grid</button>
      <button class="view-btn" data-view="timeline">Timeline</button>
    </div>
    <button class="action-btn refresh-btn" onclick="fetchAllFeeds()">Refresh</button>
    <button class="action-btn read-all-btn" onclick="markAllRead()">Mark All Read</button>
    <button class="action-btn collect-btn" onclick="triggerCollect()">Collect Now</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="feed-count">0</div>
      <div class="stat-label">Sources</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="article-count">0</div>
      <div class="stat-label">Articles</div>
    </div>
    <div class="stat">
      <div class="stat-value unread" id="unread-count">0</div>
      <div class="stat-label">Unread</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="last-updated">-</div>
      <div class="stat-label">Last Updated</div>
    </div>
  </div>

  <div class="container">
    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading feeds...</p>
      </div>
    </div>
    <div id="errors"></div>
  </div>

  <footer>
    <p>Tech News RSS Reader - Aggregating news from major tech companies and media</p>
    <p style="margin-top: 10px; font-size: 0.8rem;">Auto-refresh: 5 min | Collection interval: 10 min</p>
  </footer>

  <script>
    let feedsData = [];
    let currentFilter = 'all';
    let currentView = 'grid';
    let searchQuery = '';

    async function fetchAllFeeds() {
      const content = document.getElementById('content');
      const refreshBtn = document.querySelector('.refresh-btn');

      content.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Fetching feeds...</p>
        </div>
      `;

      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Loading...';

      try {
        const response = await fetch('/api/all-feeds');
        const data = await response.json();

        feedsData = data.feeds;
        updateStats(data);
        renderFeeds();
        renderErrors(data.errors);
      } catch (error) {
        content.innerHTML = `
          <div class="loading">
            <p style="color: #ff6b6b;">Failed to load feeds. Please try again.</p>
          </div>
        `;
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = 'Refresh';
      }
    }

    async function searchArticles(query) {
      if (!query || query.length < 2) {
        fetchAllFeeds();
        return;
      }

      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Searching...</p>
        </div>
      `;

      try {
        const response = await fetch(`/api/items?search=${encodeURIComponent(query)}&limit=100`);
        const data = await response.json();

        // Convert items to feed format for rendering
        const groupedItems = {};
        for (const item of data.items) {
          const key = item.source_name || 'Unknown';
          if (!groupedItems[key]) {
            groupedItems[key] = {
              name: item.source_name,
              icon: item.source_icon || '',
              category: item.category || 'Other',
              items: []
            };
          }
          groupedItems[key].items.push({
            id: item.id,
            title: item.title,
            link: item.link,
            pubDate: item.published_at,
            content: item.summary || '',
            creator: item.creator || '',
            read: item.read_at !== null
          });
        }

        feedsData = Object.values(groupedItems);
        document.getElementById('article-count').textContent = data.items.length;
        renderFeeds();
      } catch (error) {
        content.innerHTML = `
          <div class="loading">
            <p style="color: #ff6b6b;">Search failed. Please try again.</p>
          </div>
        `;
      }
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        searchQuery = event.target.value.trim();
        searchArticles(searchQuery);
      }
    }

    async function markItemRead(itemId, element) {
      try {
        await fetch(`/api/items/${itemId}/read`, { method: 'POST' });
        element.classList.add('read');
        element.classList.remove('unread');

        // Update unread count
        const unreadCount = document.getElementById('unread-count');
        const current = parseInt(unreadCount.textContent) || 0;
        if (current > 0) {
          unreadCount.textContent = current - 1;
        }
      } catch (error) {
        console.error('Failed to mark as read:', error);
      }
    }

    async function markAllRead() {
      const btn = document.querySelector('.read-all-btn');
      btn.disabled = true;
      btn.textContent = 'Marking...';

      try {
        await fetch('/api/items/read-all', { method: 'POST' });
        document.getElementById('unread-count').textContent = '0';

        // Update UI
        document.querySelectorAll('.feed-item, .timeline-item').forEach(el => {
          el.classList.add('read');
          el.classList.remove('unread');
        });

        showNotification('All articles marked as read');
      } catch (error) {
        console.error('Failed to mark all as read:', error);
        showNotification('Failed to mark all as read', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Mark All Read';
      }
    }

    async function triggerCollect() {
      const btn = document.querySelector('.collect-btn');
      btn.disabled = true;
      btn.textContent = 'Collecting...';

      try {
        const response = await fetch('/api/collect', { method: 'POST' });
        const data = await response.json();

        if (data.success) {
          const newItems = data.result?.newItems?.length || 0;
          showNotification(`Collection complete. ${newItems} new articles found.`);
          setTimeout(fetchAllFeeds, 1000);
        } else {
          throw new Error(data.error || 'Collection failed');
        }
      } catch (error) {
        console.error('Failed to trigger collection:', error);
        showNotification('Collection failed', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Collect Now';
      }
    }

    function showNotification(message, isError = false) {
      const bar = document.getElementById('notification-bar');
      bar.textContent = message;
      bar.style.background = isError
        ? 'linear-gradient(90deg, #ff6b6b 0%, #ee5a5a 100%)'
        : 'linear-gradient(90deg, #11998e 0%, #38ef7d 100%)';
      bar.classList.add('show');

      setTimeout(() => {
        bar.classList.remove('show');
      }, 3000);
    }

    function updateStats(data) {
      document.getElementById('feed-count').textContent = data.feeds.length;

      const totalArticles = data.feeds.reduce((sum, feed) => sum + feed.items.length, 0);
      document.getElementById('article-count').textContent = totalArticles;

      // Update unread count from stats
      if (data.stats) {
        document.getElementById('unread-count').textContent = data.stats.unreadItems || 0;
      }

      const updateTime = new Date(data.fetchedAt);
      document.getElementById('last-updated').textContent = updateTime.toLocaleTimeString();
    }

    function renderFeeds() {
      const content = document.getElementById('content');
      const filteredFeeds = currentFilter === 'all'
        ? feedsData
        : feedsData.filter(feed => feed.category === currentFilter);

      if (currentView === 'grid') {
        renderGridView(content, filteredFeeds);
      } else {
        renderTimelineView(content, filteredFeeds);
      }
    }

    function renderGridView(container, feeds) {
      if (feeds.length === 0) {
        container.innerHTML = '<div class="loading"><p>No feeds available</p></div>';
        return;
      }

      container.innerHTML = `
        <div class="feed-grid">
          ${feeds.map(feed => `
            <div class="feed-card">
              <div class="feed-card-header">
                <span class="feed-icon">${feed.icon}</span>
                <span class="feed-title">${escapeHtml(feed.name)}</span>
                <span class="feed-category">${feed.category}</span>
              </div>
              <div class="feed-items">
                ${feed.items.slice(0, 5).map(item => `
                  <div class="feed-item ${item.read ? 'read' : 'unread'}"
                       onclick="markItemRead(${item.id}, this)"
                       data-id="${item.id}">
                    ${!item.read ? '<span class="unread-badge"></span>' : ''}
                    <a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
                      ${escapeHtml(item.title)}
                    </a>
                    <div class="feed-item-meta">
                      <span>${formatDate(item.pubDate)}</span>
                      ${item.creator ? `<span>${escapeHtml(item.creator)}</span>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTimelineView(container, feeds) {
      const allItems = feeds
        .flatMap(feed => feed.items.map(item => ({
          ...item,
          feedName: feed.name,
          feedIcon: feed.icon,
          feedCategory: feed.category
        })))
        .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate))
        .slice(0, 50);

      if (allItems.length === 0) {
        container.innerHTML = '<div class="loading"><p>No articles available</p></div>';
        return;
      }

      container.innerHTML = `
        <div class="timeline-view">
          ${allItems.map(item => `
            <div class="timeline-item ${item.read ? 'read' : 'unread'}"
                 onclick="markItemRead(${item.id}, this)"
                 data-id="${item.id}">
              <div class="timeline-source">
                <span class="feed-icon">${item.feedIcon}</span>
                <span class="timeline-source-name">${escapeHtml(item.feedName)}</span>
                <span class="feed-category">${item.feedCategory}</span>
              </div>
              <a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer" class="timeline-title" onclick="event.stopPropagation()">
                ${escapeHtml(item.title)}
              </a>
              <div class="timeline-meta">
                ${formatDate(item.pubDate)}
                ${item.creator ? ` · ${escapeHtml(item.creator)}` : ''}
              </div>
              ${item.content ? `<div class="timeline-content">${escapeHtml(truncate(item.content, 200))}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderErrors(errors) {
      const errorsContainer = document.getElementById('errors');

      if (!errors || errors.length === 0) {
        errorsContainer.innerHTML = '';
        return;
      }

      errorsContainer.innerHTML = `
        <div class="errors-section">
          <h3 class="errors-title">Failed to load ${errors.length} feed(s)</h3>
          ${errors.map(error => `
            <div class="error-item">
              <div class="error-name">${escapeHtml(error.name)}</div>
              <div class="error-message">${escapeHtml(error.error)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diff = now - date;

      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;

      return date.toLocaleDateString();
    }

    function truncate(text, maxLength) {
      if (!text || text.length <= maxLength) return text;
      return text.substring(0, maxLength) + '...';
    }

    // Event listeners for filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderFeeds();
      });
    });

    // Event listeners for view toggle
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentView = btn.dataset.view;
        renderFeeds();
      });
    });

    // Initial fetch
    fetchAllFeeds();

    // Auto-refresh every 5 minutes
    setInterval(fetchAllFeeds, 5 * 60 * 1000);
  </script>
</body>
</html>

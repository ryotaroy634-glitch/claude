<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帰国準備リマインダー</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1c2330;
      --muted: #607089;
      --accent: #2267ff;
      --accent-2: #1abfa5;
      --danger: #cf456a;
      --border: #dbe3ef;
      --done: #eef9f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(160deg, #eef3ff, #f9fbff 45%, #f2fff9);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 16px 44px;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(30, 61, 120, 0.08);
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: clamp(1.5rem, 2vw, 2.1rem); }
    .sub { margin: 8px 0 0; color: var(--muted); }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .badge {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fbfcff;
    }

    .badge .num { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .badge .label { color: var(--muted); font-size: 0.86rem; }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(26, 60, 110, 0.06);
    }

    .panel h2 {
      font-size: 1.08rem;
      margin: 0 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hint { color: var(--muted); font-size: 0.85rem; margin-left: 8px; }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #fff;
    }

    .item.done { background: var(--done); }

    .item-main { flex: 1; }

    .title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }

    .title {
      font-weight: 700;
    }

    .priority {
      font-size: 0.72rem;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .high { color: #9f1542; border-color: #eb9eb8; background: #fff2f6; }
    .mid { color: #7e5600; border-color: #ecd394; background: #fff9e8; }
    .low { color: #165f57; border-color: #9de2d7; background: #edfefa; }

    .meta {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .category {
      color: var(--accent);
      font-weight: 600;
    }

    .custom-form {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr auto;
      gap: 8px;
    }

    input, select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px;
      background: #fff;
      color: var(--text);
    }

    .primary {
      border: none;
      background: linear-gradient(90deg, var(--accent), #6d8fff);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .danger {
      border: 1px solid #ec9fb4;
      background: #fff3f7;
      color: var(--danger);
      cursor: pointer;
    }

    .footer {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.84rem;
      text-align: center;
    }

    @media (max-width: 700px) {
      .custom-form { grid-template-columns: 1fr; }
      .item { align-items: center; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>🇯🇵 久しぶりの帰国準備リマインダー</h1>
      <p class="sub">「忘れ物ゼロ」を目指して、優先度とカテゴリでやることを整理できます。チェック状態はブラウザに保存されます。</p>
      <div class="summary" id="summary"></div>
    </section>

    <section class="panel">
      <h2>
        標準チェックリスト
        <span class="hint">出発前に最低限確認したい項目</span>
      </h2>
      <ul class="list" id="defaultList"></ul>
    </section>

    <section class="panel">
      <h2>
        自分用メモを追加
        <span class="hint">家族へのお土産、充電器など自由に追加</span>
      </h2>
      <form class="custom-form" id="customForm">
        <input id="customTitle" required placeholder="例: 祖父母へのお土産を買う" maxlength="80" />
        <select id="customCategory">
          <option value="持ち物">持ち物</option>
          <option value="手続き">手続き</option>
          <option value="連絡">連絡</option>
          <option value="現地準備">現地準備</option>
          <option value="その他">その他</option>
        </select>
        <select id="customPriority">
          <option value="high">高</option>
          <option value="mid" selected>中</option>
          <option value="low">低</option>
        </select>
        <button class="primary" type="submit">追加</button>
      </form>
      <ul class="list" id="customList" style="margin-top: 12px;"></ul>
    </section>

    <section class="panel">
      <h2>便利アクション</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="danger" id="resetChecks" type="button">チェック状態をリセット</button>
        <button class="danger" id="clearCustom" type="button">自分用メモを全削除</button>
      </div>
    </section>

    <p class="footer">Tip: 出発3日前・前日・当日の3回に分けて見直すと忘れにくいです。</p>
  </main>

  <script>
    const STORAGE_KEY = 'homecoming-reminder-v1';

    const defaultTasks = [
      { id: 'passport', title: 'パスポート・在留カード・身分証を確認', category: '手続き', priority: 'high' },
      { id: 'flight', title: '航空券・搭乗時間・ターミナルを再確認', category: '手続き', priority: 'high' },
      { id: 'insurance', title: '海外旅行保険・緊急連絡先をスクショ保存', category: '手続き', priority: 'mid' },
      { id: 'sim', title: '日本で使うSIM/eSIMや通信手段の準備', category: '現地準備', priority: 'mid' },
      { id: 'gifts', title: '家族・友人へのお土産をパッキング', category: '持ち物', priority: 'mid' },
      { id: 'medicine', title: '常備薬・処方薬・英文の説明書を準備', category: '持ち物', priority: 'high' },
      { id: 'charger', title: 'スマホ/PC/変換プラグ/充電器をまとめる', category: '持ち物', priority: 'high' },
      { id: 'contact', title: '帰国日を家族に共有し空港到着連絡の段取りを決める', category: '連絡', priority: 'low' }
    ];

    const state = loadState();

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { checks: {}, customTasks: [] };

      try {
        const parsed = JSON.parse(raw);
        return {
          checks: parsed.checks || {},
          customTasks: Array.isArray(parsed.customTasks) ? parsed.customTasks : []
        };
      } catch {
        return { checks: {}, customTasks: [] };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function priorityText(level) {
      return level === 'high' ? '優先:高' : level === 'mid' ? '優先:中' : '優先:低';
    }

    function renderItem(task, isCustom = false) {
      const li = document.createElement('li');
      li.className = `item ${state.checks[task.id] ? 'done' : ''}`;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(state.checks[task.id]);
      checkbox.addEventListener('change', () => {
        state.checks[task.id] = checkbox.checked;
        saveState();
        render();
      });

      const main = document.createElement('div');
      main.className = 'item-main';

      const titleLine = document.createElement('div');
      titleLine.className = 'title-line';

      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = task.title;

      const priority = document.createElement('span');
      priority.className = `priority ${task.priority}`;
      priority.textContent = priorityText(task.priority);

      titleLine.append(title, priority);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `カテゴリ: <span class="category">${task.category}</span>`;

      main.append(titleLine, meta);
      li.append(checkbox, main);

      if (isCustom) {
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'danger';
        del.textContent = '削除';
        del.addEventListener('click', () => {
          state.customTasks = state.customTasks.filter((t) => t.id !== task.id);
          delete state.checks[task.id];
          saveState();
          render();
        });
        li.appendChild(del);
      }

      return li;
    }

    function renderSummary() {
      const allTasks = [...defaultTasks, ...state.customTasks];
      const done = allTasks.filter((task) => state.checks[task.id]).length;
      const remaining = allTasks.length - done;
      const highLeft = allTasks.filter((task) => task.priority === 'high' && !state.checks[task.id]).length;

      const summary = document.getElementById('summary');
      summary.innerHTML = '';

      [
        { num: `${done}/${allTasks.length}`, label: '進捗' },
        { num: remaining, label: '未完了' },
        { num: highLeft, label: '高優先の残り' }
      ].forEach((s) => {
        const card = document.createElement('div');
        card.className = 'badge';
        card.innerHTML = `<div class="num">${s.num}</div><div class="label">${s.label}</div>`;
        summary.appendChild(card);
      });
    }

    function render() {
      const defaultList = document.getElementById('defaultList');
      const customList = document.getElementById('customList');
      defaultList.innerHTML = '';
      customList.innerHTML = '';

      defaultTasks.forEach((task) => defaultList.appendChild(renderItem(task, false)));
      state.customTasks.forEach((task) => customList.appendChild(renderItem(task, true)));

      renderSummary();
    }

    document.getElementById('customForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const titleEl = document.getElementById('customTitle');
      const categoryEl = document.getElementById('customCategory');
      const priorityEl = document.getElementById('customPriority');

      const title = titleEl.value.trim();
      if (!title) return;

      state.customTasks.push({
        id: `custom-${Date.now()}`,
        title,
        category: categoryEl.value,
        priority: priorityEl.value
      });
      titleEl.value = '';
      saveState();
      render();
    });

    document.getElementById('resetChecks').addEventListener('click', () => {
      state.checks = {};
      saveState();
      render();
    });

    document.getElementById('clearCustom').addEventListener('click', () => {
      state.customTasks.forEach((task) => delete state.checks[task.id]);
      state.customTasks = [];
      saveState();
      render();
    });

    render();
  </script>
</body>
</html>

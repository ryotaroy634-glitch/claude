<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech RSS Aggregator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel" data-presets="typescript,react">
    const { useEffect, useMemo, useState } = React;

    type Source = {
      id: number;
      name: string;
      category: string;
      sourceGroup: string;
      isRssValid: number;
    };

    type Article = {
      id: number;
      title: string;
      url: string;
      summary: string;
      publishedAt: string;
      isRead: number;
      sourceName: string;
      category: string;
      sourceGroup: string;
    };

    const App = () => {
      const [sources, setSources] = useState<Source[]>([]);
      const [articles, setArticles] = useState<Article[]>([]);
      const [page, setPage] = useState(1);
      const [total, setTotal] = useState(0);
      const [loading, setLoading] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [filters, setFilters] = useState({ category: '', sourceGroup: '', sourceId: '', read: 'false' });

      const pageSize = 20;

      const fetchSources = async () => {
        const res = await fetch('/api/sources');
        const json = await res.json();
        setSources(json.sources || []);
      };

      const fetchArticles = async (nextPage = page) => {
        setLoading(true);
        const params = new URLSearchParams({ page: String(nextPage), pageSize: String(pageSize) });
        Object.entries(filters).forEach(([k, v]) => v && params.set(k, v));
        const res = await fetch(`/api/articles?${params.toString()}`);
        const json = await res.json();
        setArticles(json.articles || []);
        setTotal(json.total || 0);
        setLoading(false);
      };

      useEffect(() => { fetchSources(); }, []);
      useEffect(() => { setPage(1); fetchArticles(1); }, [filters]);
      useEffect(() => { fetchArticles(page); }, [page]);

      const triggerRefresh = async () => {
        setRefreshing(true);
        await fetch('/api/refresh', { method: 'POST' });
        await fetchArticles(1);
        setPage(1);
        setRefreshing(false);
      };

      const markRead = async (id: number, isRead: boolean) => {
        await fetch(`/api/articles/${id}/read`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isRead })
        });
        fetchArticles(page);
      };

      const totalPages = useMemo(() => Math.max(1, Math.ceil(total / pageSize)), [total]);

      return (
        <main className="max-w-6xl mx-auto p-6">
          <header className="mb-6 bg-white rounded-xl shadow p-6">
            <h1 className="text-3xl font-bold">RSS Reader Aggregator</h1>
            <p className="text-slate-600 mt-1">ニュースメディア・企業発表を30分間隔(PT 5:00-22:00)で統合</p>
            <div className="mt-4 flex gap-2 flex-wrap">
              <button onClick={triggerRefresh} disabled={refreshing} className="px-4 py-2 rounded bg-blue-600 text-white">
                {refreshing ? '更新中...' : '手動更新'}
              </button>
              <span className="text-sm text-slate-600 self-center">Sources: {sources.length} / Articles: {total}</span>
            </div>
          </header>

          <section className="bg-white rounded-xl shadow p-4 mb-4 grid sm:grid-cols-4 gap-3">
            <select className="border rounded px-2 py-2" value={filters.sourceGroup} onChange={(e) => setFilters({ ...filters, sourceGroup: e.target.value })}>
              <option value="">全ソース種別</option>
              <option value="メディア">メディア</option>
              <option value="企業">企業</option>
            </select>
            <select className="border rounded px-2 py-2" value={filters.category} onChange={(e) => setFilters({ ...filters, category: e.target.value })}>
              <option value="">全カテゴリ</option>
              <option value="ニュースメディア">ニュースメディア</option>
              <option value="テック企業">テック企業</option>
              <option value="半導体企業">半導体企業</option>
            </select>
            <select className="border rounded px-2 py-2" value={filters.sourceId} onChange={(e) => setFilters({ ...filters, sourceId: e.target.value })}>
              <option value="">全ソース</option>
              {sources.map((s) => <option key={s.id} value={String(s.id)}>{s.name}</option>)}
            </select>
            <select className="border rounded px-2 py-2" value={filters.read} onChange={(e) => setFilters({ ...filters, read: e.target.value })}>
              <option value="">既読状態: 全て</option>
              <option value="false">未読のみ</option>
              <option value="true">既読のみ</option>
            </select>
          </section>

          {loading ? <p>Loading...</p> : (
            <section className="space-y-3">
              {articles.map((article) => (
                <article key={article.id} className={`rounded-xl p-4 shadow bg-white border-l-4 ${article.isRead ? 'border-slate-300' : 'border-blue-500'}`}>
                  <div className="flex justify-between gap-3">
                    <div>
                      <a href={article.url} target="_blank" className="font-semibold text-lg hover:underline">{article.title}</a>
                      <p className="text-sm text-slate-500">{article.sourceName} / {article.category} / {new Date(article.publishedAt).toLocaleString()}</p>
                    </div>
                    <button onClick={() => markRead(article.id, !article.isRead)} className="text-sm px-3 py-1 rounded border">
                      {article.isRead ? '未読に戻す' : '既読にする'}
                    </button>
                  </div>
                  <p className="text-slate-700 mt-2">{article.summary || '概要なし'}</p>
                </article>
              ))}
            </section>
          )}

          <footer className="mt-6 flex justify-center gap-3 items-center">
            <button disabled={page <= 1} className="px-3 py-1 border rounded disabled:opacity-40" onClick={() => setPage(page - 1)}>Prev</button>
            <span>{page} / {totalPages}</span>
            <button disabled={page >= totalPages} className="px-3 py-1 border rounded disabled:opacity-40" onClick={() => setPage(page + 1)}>Next</button>
          </footer>
        </main>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
